steps:
  # 1. Install dependencies using Bun
  - name: 'oven/bun:latest'
    entrypoint: 'bun'
    args: ['install']
    id: Install Dependencies

  # 2. Compile the static Astro site (output directory: dist/)
  - name: 'oven/bun:latest'
    entrypoint: 'bun'
    args: ['run', 'build']
    id: Build Static Site
    waitFor: ['Install Dependencies']

  # 3. Deploy to Firebase Hosting Preview Channel targeting rohitkharche
  - name: 'us-docker.pkg.dev/firebase-cli/us/firebase:latest'
    args: ["hosting:channel:deploy", "$_PREVIEW_NAME", "--project=$PROJECT_ID", "--only=$_TARGET_NAME", "--expires=$_EXPIRES"]
    id: Deploy to Firebase Hosting Channel
    waitFor: ['Build Static Site']

substitutions:
  _TARGET_NAME: rohitkharche
  _PREVIEW_NAME: starwind
  _EXPIRES: 7d

options:
  logging: CLOUD_LOGGING_ONLY

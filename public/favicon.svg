<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <g transform="translate(16, 16)">
    <!-- Large primary petals -->
    <path d="M 0,0 C -5,-10 -8,-14 0,-15 C 8,-14 5,-10 0,0" fill="url(#flowerGrad)" opacity="0.85" />
    <path d="M 0,0 C -5,-10 -8,-14 0,-15 C 8,-14 5,-10 0,0" fill="url(#flowerGrad)" opacity="0.85" transform="rotate(60)" />
    <path d="M 0,0 C -5,-10 -8,-14 0,-15 C 8,-14 5,-10 0,0" fill="url(#flowerGrad)" opacity="0.85" transform="rotate(120)" />
    <path d="M 0,0 C -5,-10 -8,-14 0,-15 C 8,-14 5,-10 0,0" fill="url(#flowerGrad)" opacity="0.85" transform="rotate(180)" />
    <path d="M 0,0 C -5,-10 -8,-14 0,-15 C 8,-14 5,-10 0,0" fill="url(#flowerGrad)" opacity="0.85" transform="rotate(240)" />
    <path d="M 0,0 C -5,-10 -8,-14 0,-15 C 8,-14 5,-10 0,0" fill="url(#flowerGrad)" opacity="0.85" transform="rotate(300)" />
    
    <!-- Small accent petals -->
    <path d="M 0,0 C -3,-6 -5,-10 0,-11 C 5,-10 3,-6 0,0" fill="#FBBF24" opacity="0.65" transform="rotate(30)" />
    <path d="M 0,0 C -3,-6 -5,-10 0,-11 C 5,-10 3,-6 0,0" fill="#FBBF24" opacity="0.65" transform="rotate(90)" />
    <path d="M 0,0 C -3,-6 -5,-10 0,-11 C 5,-10 3,-6 0,0" fill="#FBBF24" opacity="0.65" transform="rotate(150)" />
    <path d="M 0,0 C -3,-6 -5,-10 0,-11 C 5,-10 3,-6 0,0" fill="#FBBF24" opacity="0.65" transform="rotate(210)" />
    <path d="M 0,0 C -3,-6 -5,-10 0,-11 C 5,-10 3,-6 0,0" fill="#FBBF24" opacity="0.65" transform="rotate(270)" />
    <path d="M 0,0 C -3,-6 -5,-10 0,-11 C 5,-10 3,-6 0,0" fill="#FBBF24" opacity="0.65" transform="rotate(330)" />
    
    <!-- Flower core center -->
    <circle cx="0" cy="0" r="3.5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1" />
  </g>
</svg>
